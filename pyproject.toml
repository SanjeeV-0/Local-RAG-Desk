[project]
name = "local-rag-desk"
version = "0.1.0"
description = "Local RAG Desk -- a single-user RAG research and engineering knowledge desk"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Sanjeev Sankar J" }
]
dependencies = [
    "alembic>=1.16,<2.0",
    "fastapi>=0.141,<1.0",
    "pgvector>=0.4,<1.0",
    "psycopg[binary]>=3.3,<4.0",
    "pydantic-settings>=2.0,<3.0",
    "python-docx>=1.1,<2.0",
    "python-multipart>=0.0.9,<1.0",
    "pypdf>=5,<7",
    "sentence-transformers>=5,<6",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.52,<1.0",
    "openai>=1.0,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "httpx2>=0.1",
    "ruff>=0.16,<0.17",
    # Only used to regenerate the Benchmark V2 PDF fixtures
    # (tests/evaluation/fixtures/convert_benchmark_v2_formats.py); the
    # committed .pdf files are read back via the production pypdf
    # dependency, not reportlab.
    "reportlab>=5,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"